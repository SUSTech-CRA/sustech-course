# ============================================================================
# ncesnext.com — 后端机分流层（监听 8080，仅供边缘层内网访问）
# 职责：路径分流（API → uvicorn / 静态直接读盘）、SPA fallback、粗粒度限流、压缩
# 放置：后端机 /etc/nginx/conf.d/ 或 sites-enabled/
# 上游：uvicorn 4 worker @127.0.0.1:3001
# 前端产物：/opt/ncesnext/frontend/dist（按实际 checkout 路径替换）
#
# 缓存策略总览（Cache-Control 单一来源在本层，边缘层只做 proxy_cache 不再加头）：
#   /assets/*     1 年 + immutable（Vite 构建产物文件名带内容 hash）
#   /uploads/*    30 天（上传文件名为随机 hash、从不复用，可放心长缓存）
#   /index.html   no-cache（每次协商验证；否则浏览器启发式缓存旧 index，
#                 部署后会引用已删除的 hashed chunk 导致白屏）
#   /static/*     老应用静态目录，仅图片 7 天（老点评富文本仍有引用）
# ============================================================================

# 校园 NAT 下多用户共享出口 IP，此处阈值放宽只作洪水闸；精细限流在应用层按用户/IP 分键
limit_req_zone $binary_remote_addr zone=nces_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nces_auth:10m rate=5r/s;

# WebSocket 升级头映射（当前应用无 WS，预留兼容；同机多份配置只保留一份此 map）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name ncesnext.com;

    access_log /var/log/nginx/ncesnext.access.log;
    error_log  /var/log/nginx/ncesnext.err.log;

    # 与边缘层一致（边缘 50M 先拦，本层配更大值不会生效）
    client_max_body_size 50M;

    root /opt/ncesnext/frontend/dist;
    index index.html;

    # 信任边缘层传来的 X-Real-IP；realip 之后 $remote_addr 即真实客户端 IP，
    # 限流按真实 IP 分键。前提：8080 端口不对公网开放。
    # EDGE_NGINX_SUBNET 替换为边缘层所在的内网网段（如 10.0.0.0/24）
    set_real_ip_from EDGE_NGINX_SUBNET;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from unix:;
    real_ip_header X-Real-IP;

    # ---- 压缩（站点级显式配置，不依赖 nginx.conf 全局）----
    # 静态 js/css 与 API JSON 都在本层压缩；gzip_vary 保证边缘缓存按编码分变体。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript
                 application/javascript application/json application/xml
                 application/rss+xml application/atom+xml image/svg+xml;

    # cf trace 仿真端点（内网直连时可用；经边缘访问的请求由边缘层同名端点应答）
    location = /cdn-cgi/trace {
        default_type text/plain;
        return 200 'fl=nces-backend
ip=$remote_addr
ts=$msec
visit_scheme=$scheme
uag=$http_user_agent
colo=SZX
http=$server_protocol
tls=$ssl_protocol
sni=$ssl_server_name
';
    }

    # ---- API：认证路径独立小配额 ----
    location /api/v1/auth/ {
        limit_req zone=nces_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/ {
        limit_req zone=nces_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # feed/robots/sitemap 由 FastAPI 动态生成（sitemap 应用层已有 1h 缓存）。
    # ads.txt 不在此列：dist 根目录有同名静态文件，走下方 SPA location 直接读盘。
    location ~ ^/(feed\.xml|robots\.txt|sitemap.*\.xml)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- 上传目录：直接读盘（root 为 UPLOAD_FOLDER 的父目录；仅存量文件，新上传在 R2）----
    # 扩展名白名单在应用层控制；nosniff 防内容嗅探作纵深防御。
    location /uploads/ {
        root /var/lib/ncesnext;
        autoindex off;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # ---- 前端构建产物：内容 hash 文件名 → 一年 + immutable ----
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ---- 老应用静态目录（老点评富文本中仍引用 /static/... 图片；无老数据可删除）----
    location /static/ {
        root /opt/legacy-course-app/app;
        autoindex off;
        location ~* \.(jpg|jpeg|png|webp)$ {
            add_header Cache-Control "public, max-age=604800";
        }
    }

    # ---- SPA 入口：禁用启发式缓存，部署即生效（协商验证，304 开销极小）----
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    # ---- SPA fallback：dist 根的真实文件（ads.txt、占位图）直接返回，其余回 index ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
