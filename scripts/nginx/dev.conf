# ============================================================================
# dev.ncesnext.com — 开发机
# 职责：TLS 终止后转发给 Vite dev server（8001，Vite 再代理 /api 等到 uvicorn 8000）
# 放置：开发机 /etc/nginx/conf.d/ 或 sites-enabled/
#
# 保留 nginx + 真域名 + HTTPS 的原因：CAS SSO 回调与 Turnstile 需要真实域名，
# Secure cookie 需要 HTTPS；同时保证直连 :8001 与走域名的行为一致。
# ============================================================================

# Vite HMR 走 WebSocket，必须带 Upgrade 头（同机多份配置只保留一份此 map）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.ncesnext.com;

    access_log /dev/null;
    error_log /dev/null;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 保持关闭（沿用原配置；开启也不影响 HMR——浏览器的 ws 会另开 HTTP/1.1 连接）
    #http2 on;
    server_name dev.ncesnext.com;

    access_log /var/log/nginx/dev.ncesnext.access.log;
    error_log /var/log/nginx/dev.ncesnext.err.log;

    ssl_certificate     /etc/nginx/ssl/ncesnext.com/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/ncesnext.com/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    client_max_body_size 50M;

    # ---- 压缩（Vite dev 输出大量未打包模块，远程开发时收益明显）----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript
                 application/javascript application/json application/xml
                 application/rss+xml application/atom+xml image/svg+xml;

    # cf trace 仿真端点
    location = /cdn-cgi/trace {
        default_type text/plain;
        return 200 '
fl=nces-dev
ip=$remote_addr
ts=$msec
visit_scheme=$scheme
uag=$http_user_agent
colo=SZX
http=$server_protocol
tls=$ssl_protocol
sni=$ssl_server_name
';
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Vite HMR websocket：升级头 + 拉长读写超时，避免长连接被默认 60s 切断
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 老应用静态目录（与 backend.conf 一致）
    location /static/ {
        root /opt/legacy-course-app/app;
        autoindex off;
        location ~* \.(jpg|jpeg|png|webp)$ {
            add_header Cache-Control "public, max-age=604800";
        }
    }

    # 上传目录：开发环境不设长缓存，避免调试上传功能时被缓存干扰
    location /uploads/ {
        root /var/lib/ncesnext;
        autoindex off;
        add_header X-Content-Type-Options "nosniff";
    }
}
