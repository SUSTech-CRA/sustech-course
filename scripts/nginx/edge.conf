# ============================================================================
# ncesnext.com — 公网边缘层
# 职责：TLS 终止、HTTP→HTTPS、反向代理到后端机、静态资源磁盘缓存
# 放置：边缘机 /etc/nginx/conf.d/ 或 sites-enabled/（均位于 http 上下文内）
# 上游：BACKEND_NGINX_HOST:8080（后端机 nginx，见 backend.conf；按实际内网地址替换）
#
# 依赖 nginx.conf http 块中已有的缓存区定义（本文件不重复定义，避免 duplicate zone）：
#   proxy_cache_path /var/cache/nginx/static levels=1:2
#       keys_zone=static_cache:100m max_size=5g inactive=7d use_temp_path=off;
#
# 换正式站域名时：改两处 server_name + 日志文件名即可（证书为 ncesnext.com 通用）。
# ============================================================================

# WebSocket 升级头映射（当前应用无 WS，预留兼容；同机多份配置只保留一份此 map）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ncesnext.com;

    access_log /dev/null;
    error_log /dev/null;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ncesnext.com;

    access_log /var/log/nginx/ncesnext.access.log;
    error_log /var/log/nginx/ncesnext.err.log;

    ssl_certificate     /etc/nginx/ssl/ncesnext.com/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/ncesnext.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nces_ssl:10m;
    ssl_session_timeout 1d;

    # 与后端层一致；这里先拦，后端配更大值也不会生效
    client_max_body_size 50M;

    # ---- 压缩（站点级显式配置，不依赖 nginx.conf 全局）----
    # 后端层已压缩的响应在此透传（不会二次压缩），这里只兜底未压缩的上游响应。
    # text/html 不列入 types：模块默认恒压缩，重复列出会报 duplicate MIME type。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript
                 application/javascript application/json application/xml
                 application/rss+xml application/atom+xml image/svg+xml;

    # cf trace 仿真端点
    location = /cdn-cgi/trace {
        default_type text/plain;
        return 200 '
fl=nces-edge
ip=$remote_addr
ts=$msec
visit_scheme=$scheme
uag=$http_user_agent
colo=SZX
http=$server_protocol
tls=$ssl_protocol
sni=$ssl_server_name
';
    }

    # ---- 静态资源：边缘磁盘缓存 ----
    # Cache-Control 由后端层统一设置（assets 1y immutable / uploads 30d），
    # 这里不再 add_header 缓存头，避免响应中出现多个互相冲突的 Cache-Control。
    # 压缩变体由 Vary: Accept-Encoding 区分，proxy_cache 默认按变体分开存储。
    location ~ ^/(assets|uploads)/ {
        proxy_pass http://BACKEND_NGINX_HOST:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache static_cache;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;      # 负缓存：防 404 反复打穿后端
        proxy_cache_revalidate on;     # 过期条目条件回源，304 免重传文件体
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # ---- 其余全部（SPA HTML / API / feed / robots 等）：直通不缓存 ----
    location / {
        proxy_pass http://BACKEND_NGINX_HOST:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
